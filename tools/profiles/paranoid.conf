# hollow profile: nothing optional. no 32-bit, kexec and module loading frozen after boot.
description=nothing optional, modules and kexec frozen
ia32_gate=closed
sysctl.kernel.yama.ptrace_scope=3
sysctl.kernel.kptr_restrict=2
sysctl.kernel.perf_event_paranoid=3
sysctl.kernel.io_uring_disabled=2
sysctl.kernel.kexec_load_disabled=1
sysctl.kernel.modules_disabled=1
